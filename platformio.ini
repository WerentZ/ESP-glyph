; PlatformIO project for Glyph Matrix (ESP32 + SSD1306 128x64)
;
; Firmware:  pio run -t upload
; Website:   http://192.168.4.1  (or http://glyph.local)
;
; The web UI is embedded into the firmware from web/index.html (see scripts/embed_web.py),
; no separate filesystem upload is needed.
; The editor.html file is a standalone phone editor and is not part of the firmware.
; Animations are stored in LittleFS and uploaded through the website.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Default partition table: ~1.4 MB of LittleFS for animations.
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DGLYPH_FW_NAME="Glyph Matrix"

extra_scripts = pre:scripts/embed_web.py

lib_deps =
    gyverlibs/GyverOLED@^1.6.4
